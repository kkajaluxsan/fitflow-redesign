name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci || echo "No package-lock.json yet - scaffold stage"
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint
        run: |
          pip install ruff
          ruff check . || true
      - name: Tests
        run: |
          pip install pytest
          pytest -q || echo "No tests yet - scaffold stage"

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get || echo "No pubspec.yaml yet - scaffold stage"
      - name: Analyze
        run: flutter analyze || true
      - name: Tests
        run: flutter test || echo "No tests yet - scaffold stage"

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documents exist
        run: |
          for f in README.md docs/tech-stack.md docs/comparison-matrix.md \
                   docs/architecture.md docs/adr/ADR-001-technology-stack.md; do
            test -f "$f" || { echo "Missing required document: $f"; exit 1; }
          done
          echo "All required Lab 05 documents are present."
