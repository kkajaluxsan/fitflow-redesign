name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Node project
        id: check
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet. The backend is still at scaffold stage, so the build steps are skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Unit tests
        if: steps.check.outputs.present == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.present == 'true'
        run: npm run build --if-present

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Python project
        id: check
        run: |
          if [ -f requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No requirements.txt yet. The AI service is still at scaffold stage, so the build steps are skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        if: steps.check.outputs.present == 'true'
        run: |
          pip install ruff
          ruff check .

      - name: Tests
        if: steps.check.outputs.present == 'true'
        run: |
          pip install pytest
          pytest -q

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Flutter project
        id: check
        run: |
          if [ -f pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml yet. The Flutter app is still at scaffold stage, so the build steps are skipped."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.present == 'true'
        with:
          channel: stable

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.check.outputs.present == 'true'
        run: flutter analyze

      - name: Tests
        if: steps.check.outputs.present == 'true'
        run: flutter test

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the required documents exist
        run: |
          missing=0
          for f in README.md \
                   docs/tech-stack.md \
                   docs/comparison-matrix.md \
                   docs/architecture.md \
                   docs/adr/ADR-001-technology-stack.md \
                   docs/diagrams/architecture-diagram.png \
                   docs/diagrams/data-flow-nutrition.png; do
            if [ -f "$f" ]; then
              echo "found    $f"
            else
              echo "MISSING  $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required Lab 05 documents are missing."
            exit 1
          fi
          echo "All required Lab 05 documents are present."
